gerbil_version: "1.5.2"
pangolin_version: "ee-1.25.3"
traefik_version: "v3.7.16"
badger_version: "v1.7.0"
crowdsec_traefik_version: "v1.8.1"
crowdsec_version: "latest"
crowdsec_manager_version: "latest"
newt_enabled: false
newt_version: "latest"
newt_pangolin_endpoint: ""
newt_id: ""
newt_secret: ""
pangolin_compose_path: "/data/pangolin"
pangolin_traefik_path: "/data/pangolin/config/traefik"

pangolin_crowdsec_allowlist_enabled: true
pangolin_crowdsec_allowlist_name: "pangolin-whitelist"
pangolin_crowdsec_container_name: "crowdsec"
pangolin_crowdsec_allowlist_database: "{{ pangolin_compose_path }}/config/db/db.sqlite"
pangolin_crowdsec_allowlist_script_path: "/usr/local/sbin/pangolin-crowdsec-allowlist"
pangolin_crowdsec_allowlist_log_path: "/var/log/pangolin-crowdsec-allowlist.log"
pangolin_crowdsec_allowlist_schedule: "daily"
